name: Test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The smoke test drives real Terraform against a locally built binary.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # lint + unit tests + the offline smoke plan.
      - run: make check

      # A regenerated client or a stale docs/ directory should fail the build
      # rather than drift silently.
      - name: Verify generated files are up to date
        run: |
          make generate docs
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate docs' and commit the result."
            exit 1
          fi
